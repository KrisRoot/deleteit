<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login</title>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f3f6fa}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.08);width:320px;box-sizing:border-box}
  form{display:flex;flex-direction:column;gap:12px}
  label{font-size:13px;color:#374151}
  input{padding:10px;border:1px solid #e6e9ef;border-radius:8px;font-size:14px;outline:none}
  button{
    padding:10px;border-radius:8px;border:none;
    background:linear-gradient(180deg,#ffd54a,#ffcc00); /* yellow */
    color:#111;font-weight:700;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  button:active{transform:translateY(1px)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="region" aria-label="Login">
      <form onsubmit="event.preventDefault()">
        <label for="username">Login</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Confirm</button>
      </form>
    </div>
  </div>
</body>
</html>
